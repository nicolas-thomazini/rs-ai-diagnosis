[package]
name = "rust-ai-buddy"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lints.rust]
unsafe_code = "forbid"
unused = "allow"

[dependencies]
# --- async ---
tokio = { version = "1", features = ["full"] } 
# --- HTTP Client ---
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
# --- dotenv ---
dotenv = "0.15"
# --- d/serialize ---
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# --- cli ---
dialoguer = "0.11"
console = "0.15"
textwrap = "0.16"
# --- files ---
walkdir = "2"
globset = "0.4"
# --- others ---
derive_more = { version = "1.0.0-beta", features = ["from", "display", "deref"] }